Description: |-
  Boring Browser is a Windows browser built on ungoogled-chromium.
  Ad, tracker and pop-up blocking are on from the start, with HTTPS first and Quad9 secure DNS.
  It checks its own site once a day for a new release and installs one only with your OK.
  The installer is not signed yet, so Windows SmartScreen may warn.
