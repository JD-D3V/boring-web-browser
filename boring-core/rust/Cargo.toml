[package]
name = "adblock_ffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "boring_adblock"
# cdylib is the DLL the browser loads. rlib lets the list checker below
# use the same parsing code, so what the publisher checks is what the
# browser will do.
crate-type = ["cdylib", "rlib"]

# Parses filter lists line by line with the engine's own parser, for
# tools/publish_lists.py. Never shipped with the browser.
[[bin]]
name = "check_lists"
path = "src/bin/check_lists.rs"

[dependencies]
# "css-validation" sorts procedural rules such as :has-text() into
# procedural_actions instead of passing them on as CSS selectors.
# Without "single-thread", which is on by default: that feature makes the
# engine share state through Rc and RefCell, and the browser checks
# requests from several threads at once.
adblock = { version = "0.13.3", default-features = false, features = [
    "css-validation",
    "embedded-domain-resolver",
    "full-regex-handling",
] }
serde_json = "1"

[dev-dependencies]
base64 = "0.22"

[profile.release]
lto = true
