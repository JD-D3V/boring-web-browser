# Publish the blocking lists the installed browser downloads.
#
# The lists are baked in when the browser is built, so on someone's
# machine they only get older. This job rebuilds them and uploads them
# to one release tag, "lists", that the browser checks on a schedule.
# The tag is reused, so the address in the browser never changes.
#
# Filter rules only: EasyList, uBO's lists, the cookie list, the
# Aggressive lists and every regional list with its index. Scriptlet and
# $redirect resources ship only with signed browser updates, and the
# browser ignores a resources file in a bundle.
#
# Automatic, but careful. publish_lists.py refuses a bundle that fails
# any download check, that shrinks sharply against the bundle published
# now (limits per list are in publish_lists.py), or that the browser's
# own engine code cannot parse (check_lists, built below). A refusal
# fails the run and leaves the published bundle alone.
#
# Publishing is unattended when every check passes. If any source failed
# and the bundle was built without it (the manifest says "degraded"), the
# run stops after the build with an error that names the failed sources,
# and nothing is published. JD reads it and, if the thinner bundle is
# fine, starts the workflow by hand from the Actions tab on main with
# allow_degraded ticked. That is the only way a degraded bundle goes out.
#
# Only main publishes. A run on any other branch builds and checks the
# bundle and ends there, so a branch can prove the build without being
# able to reach the key.
#
# Two jobs, so the signing key is only ever in a job that has already
# passed every check: the BORING_LIST_SIGNING_KEY secret belongs to the
# "lists" environment, and only the publish job uses that environment.
# The environment also has a required reviewer rule, which makes a
# scheduled run wait for a click; while it is there nothing publishes
# unattended. See the environment settings in the repository.

name: lists

on:
  # Twice a week. The browser looks at most once a day, and only once
  # its lists are a week old.
  schedule:
    - cron: "17 4 * * 1,4"
  workflow_dispatch:
    inputs:
      allow_degraded:
        description: "Publish a bundle built without some source that failed (read the build summary first)"
        type: boolean
        default: false

permissions:
  contents: read

# No concurrency group, on purpose. GitHub keeps one running and one
# waiting run per group and cancels the older waiting one, which is how
# scheduled runs used to be cancelled while they waited. The publish job
# checks for itself that it never replaces a bundle with an older or
# equal one, which is what two runs on the same tag could get wrong.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      degraded: ${{ steps.state.outputs.degraded }}
    env:
      GH_TOKEN: ${{ github.token }}
      DIST: ${{ github.workspace }}/dist
      PREV: ${{ github.workspace }}/previous
    steps:
      - name: Check out our files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The same parser the browser uses, to read every list before it
      # goes out. The runner image has Rust; the version is whatever
      # rustup has as stable, which the crate builds with.
      - name: Build the list checker
        working-directory: boring-core/rust
        run: cargo build --release --locked --bin check_lists

      # The runner starts empty every time, so without this the tool has
      # nothing to compare against and every run looks like a first run.
      # The shrink limits only work if the previous bundle is here.
      - name: Fetch the bundle that is published now
        run: |
          mkdir -p "$PREV"
          if gh release view lists >/dev/null 2>&1; then
            gh release download lists -D "$PREV" --clobber
            ls -l "$PREV"
          else
            echo "no lists release yet, this is the first run"
          fi

      # The scam list is checked against the public suffix list and the top
      # sites list. Both are copied into boring-core/tools/data (see SOURCES.txt
      # there), so the runner needs no Chromium tree.
      # Unsigned here on purpose: this job never sees the key. The
      # signing job below signs exactly these bytes.
      - name: Build and check the bundle
        working-directory: boring-core/tools
        env:
          BORING_LIST_CHECKER: ${{ github.workspace }}/boring-core/rust/target/release/check_lists
        run: python publish_lists.py --out "$DIST" --previous "$PREV" --unsigned

      - name: Check the bundle is there
        run: |
          test -s "$DIST/lists.json" || { echo "no manifest in $DIST"; exit 1; }
          # The upload below sends every file in the folder, so these two
          # only need to exist: the scam list and the notice that has to
          # travel with it.
          for f in scamlist.txt NOTICES-scam-blocklist.txt; do
            test -s "$DIST/$f" || { echo "no $f in $DIST"; exit 1; }
          done
          if [ -e "$DIST/resources.json" ]; then
            echo "resources.json must never be in a list bundle"; exit 1
          fi
          ls -l "$DIST"

      # publish_lists.py writes "degraded": true into the manifest when a
      # source failed and the bundle was built without it. A manifest
      # without the field counts as degraded.
      - name: Say whether the bundle is complete
        id: state
        run: |
          degraded=$(jq -r 'if has("degraded") then .degraded else true end | tostring' "$DIST/lists.json")
          echo "degraded=$degraded" >> "$GITHUB_OUTPUT"
          {
            echo "### Bundle $(jq -r .version "$DIST/lists.json")"
            echo
            if [ "$degraded" = "true" ]; then
              echo "**Degraded.** Built without these sources:"
              jq -r '.sources[] | select(.ok != true) | "- \(.name): \(.reason)"' "$DIST/lists.json"
            else
              echo "Complete. Every source answered and passed its checks."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "degraded: $degraded"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # A degraded bundle stops here, loudly, instead of publishing. The run
  # shows red so JD gets the failure notice; the build summary names the
  # sources. Runs on main only, like publish.
  hold:
    needs: build
    if: >-
      github.ref == 'refs/heads/main'
      && needs.build.outputs.degraded == 'true'
      && !inputs.allow_degraded
    runs-on: ubuntu-latest
    steps:
      - name: Stop before publishing
        run: |
          echo "::error title=Lists not published::The bundle was built without some source (see the build job summary for which). Nothing was published. If the thinner bundle is fine, run this workflow by hand on main with allow_degraded ticked."
          exit 1

  publish:
    needs: build
    # Main only, and only when every check passed, or when a manual run
    # on main said allow_degraded.
    if: >-
      github.ref == 'refs/heads/main'
      && (needs.build.outputs.degraded != 'true' || inputs.allow_degraded)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The signing key lives in this environment and nowhere else. If the
    # environment has required reviewers, the job waits here, and the key
    # does not exist for it, until a reviewer approves the run.
    environment: lists
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DIST: ${{ github.workspace }}/dist
    steps:
      - name: Check out our files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist/

      # No concurrency group serialises publishers, so two runs could
      # both be about to publish. The bundle version only goes up, so a
      # run whose version is not above the published one has been
      # overtaken and must not replace it.
      - name: Check this bundle is newer than the one published
        run: |
          if gh release view lists -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
             && gh release download lists -R "$GITHUB_REPOSITORY" -p lists.json -O published.json --clobber; then
            ours=$(jq -r .version "$DIST/lists.json")
            theirs=$(jq -r .version published.json)
            echo "this bundle is $ours, published is $theirs"
            if [ "$ours" -le "$theirs" ]; then
              echo "::error title=Lists not published::A bundle at version $theirs is already out; this one ($ours) is not newer."
              exit 1
            fi
          else
            echo "nothing published yet"
          fi

      # Signs the manifest exactly as the build job checked it, with
      # openssl from the runner image. publish_lists.py writes the key to
      # a private temporary file and removes it whatever happens.
      - name: Sign the manifest
        working-directory: boring-core/tools
        env:
          BORING_LIST_SIGNING_KEY: ${{ secrets.BORING_LIST_SIGNING_KEY }}
        run: python publish_lists.py --sign-bundle "$DIST"

      - name: Make the lists release if it is not there yet
        run: |
          if ! gh release view lists -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create lists -R "$GITHUB_REPOSITORY" \
              --title "Blocking lists" \
              --notes "Ad, tracker and annoyance filter lists the browser downloads to stay current. Replaced twice a week; this tag always holds the newest set." \
              --latest=false
          fi

      # Lists first, manifest and signature last, so a browser reading
      # the release part way through finds an old manifest whose hashes
      # do not match the new lists and refuses them, rather than a new
      # manifest naming files that are not up yet.
      - name: Upload the bundle
        run: |
          set -euo pipefail
          shopt -s extglob
          gh release upload lists -R "$GITHUB_REPOSITORY" --clobber "$DIST"/!(lists.json|lists.json.sig)
          gh release upload lists -R "$GITHUB_REPOSITORY" --clobber "$DIST/lists.json" "$DIST/lists.json.sig"
          # An older bundle carried resources.json. Nothing reads it now.
          gh release delete-asset lists resources.json -R "$GITHUB_REPOSITORY" -y || true
