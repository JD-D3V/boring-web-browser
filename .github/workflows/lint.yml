# Format and lint checks.
#
# These run on GitHub's free cloud runners, unlike build.yml, which needs the
# self hosted machine because Chromium is far too big for a cloud runner.
# Linting needs none of that, so it can run on every push and give an answer
# in a minute or two.
#
# Tool versions are pinned. An unpinned formatter reformats the world the day
# it updates, and then the check fails on code nobody touched.

name: lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cpp:
    name: C++ (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install clang-format==23.1.0
      # Report only, on purpose. The C++ was written before this check
      # existed, and reformatting it now would make every open branch that
      # touches those files conflict. After Release 3 ships, the C++ is
      # reformatted in one commit and this step goes back to failing the
      # run: put --Werror back on the clang-format call and drop the
      # "|| true" (ledger 110).
      - name: Check formatting (report only)
        run: |
          clang-format --version
          find boring-core/components/boring \
            \( -name '*.cc' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run > clang-format.log 2>&1 || true
          places=$(grep -c 'code should be clang-formatted' clang-format.log || true)
          files=$(grep 'code should be clang-formatted' clang-format.log \
            | cut -d: -f1 | sort -u | wc -l)
          echo "::warning title=clang-format (report only)::$places places in $files files are not clang-formatted. This does not fail the run until after Release 3."
          {
            echo "### clang-format (report only)"
            echo
            echo "$places places in $files files differ from .clang-format."
            echo "Not a failure until the C++ is reformatted after Release 3."
            echo
            echo "Files (places):"
            grep 'code should be clang-formatted' clang-format.log \
              | cut -d: -f1 | sort | uniq -c | sed 's/^ *\([0-9]*\) \(.*\)/- \2 (\1)/'
          } >> "$GITHUB_STEP_SUMMARY"

  rust:
    name: Rust (fmt + clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boring-core/rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  go:
    name: Go (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the Go the linter binary was built with (v2.13.2 is built
      # with 1.27.0). With "stable" the runner got Go 1.27.3, and a
      # golangci-lint built with another Go cannot read that standard
      # library: every run failed with "could not import encoding/json ...
      # could not load export data" before checking any code. Move the two
      # versions together.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache-dependency-path: sync-server/go.sum
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          working-directory: sync-server

  python:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ruff==0.16.5
      - run: ruff format --check .
      - run: ruff check .
